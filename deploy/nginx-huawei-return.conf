# Site on 10.128.19.191 (HTTPS). The browser stays on this origin.
# Example only. The live site does not use a new server block.
# Include deploy/huawei-return.nginx.conf inside the existing HTTPS server
# (on this host: /etc/nginx/conf.d/customer-service-both.conf).
# The API listens on 127.0.0.1:8791 and opens PostgreSQL on 10.128.19.192:15432.
# Do not point the page at http://10.128.19.192 — that is mixed content and is blocked.

server {
    listen 443 ssl;
    server_name 10.128.19.191;

    # ssl_certificate     /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;

    client_max_body_size 32m;
    gzip on;
    gzip_types application/json text/css application/javascript;

    location /Huawei-Return/api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /Huawei-Return/ {
        alias /var/www/html/Huawei-Return/;
        index index.html;
    }
}
